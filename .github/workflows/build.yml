name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q -o 'ParticleWallpaper*.zip'
      - run: gradle -p ParticleWallpaper assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ParticleWallpaper-debug-apk
          path: ParticleWallpaper/app/build/outputs/apk/debug/app-debug.apk
